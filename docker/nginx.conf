pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 40m;
    client_body_timeout 30s;
    map "$http_host|$http_origin" $local_request {
        default 0;
        "127.0.0.1:18080|" 1;
        "localhost:18080|" 1;
        "127.0.0.1:18080|http://127.0.0.1:18080" 1;
        "localhost:18080|http://localhost:18080" 1;
    }
    server {
        listen 8080;
        if ($local_request = 0) { return 403; }
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 65s;
        }
        location /app/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), display-capture=()" always;
            add_header X-Frame-Options "DENY" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' blob:; media-src 'self' blob:; font-src 'self'; worker-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        }
    }
}
