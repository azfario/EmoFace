name: emoface_local
services:
  frontend:
    image: ${COMPOSE_PROJECT_NAME:-emoface_local}-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports: ["127.0.0.1:18080:8080"]
    networks: [local_only]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=101,gid=101,mode=700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null --header='Host: 127.0.0.1:18080' http://127.0.0.1:8080/app/"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: "no"
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    network_mode: service:frontend
    depends_on:
      network_guard: {condition: service_completed_successfully}
    environment:
      POSTGRES_USER: faceattend_compose_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256 --encoding=UTF8
    command: [postgres, -c, listen_addresses=127.0.0.1, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    secrets: [db_admin_password, db_owner_password, db_runtime_password]
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/init_database.sh:/docker-entrypoint-initdb.d/10-faceattend.sh:ro
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U faceattend_compose_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: "no"
  network_guard:
    image: ${COMPOSE_PROJECT_NAME:-emoface_local}-frontend
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    network_mode: service:frontend
    depends_on:
      frontend: {condition: service_started, restart: true}
    user: "0:0"
    entrypoint: [sh, /opt/network_guard.sh]
    volumes: ["network_state:/netstate"]
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    restart: "no"
  migrate:
    image: ${COMPOSE_PROJECT_NAME:-emoface_local}-api
    network_mode: service:frontend
    depends_on:
      db: {condition: service_healthy}
    command: [python, docker/runtime.py, migrate]
    secrets: [db_owner_password]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=700"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: "no"
  api:
    image: ${COMPOSE_PROJECT_NAME:-emoface_local}-api
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    network_mode: service:frontend
    depends_on:
      frontend: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      network_guard: {condition: service_completed_successfully}
    environment:
      FACEATTEND_ENROLLMENT_ENABLED: "true"
      FACEATTEND_FRONTEND_ENABLED: "true"
      FACEATTEND_FACE_ANALYSIS_ENABLED: "true"
      FACEATTEND_CANDIDATES_ENABLED: "true"
      FACEATTEND_DB_TELEMETRY_ENABLED: "false"
      FACEATTEND_ENROLLMENT_RETENTION_DAYS: "30"
    secrets: [db_runtime_password, gallery_key, operator_auth]
    volumes:
      - private_data:/var/lib/faceattend
      - network_state:/netstate:ro
      - type: bind
        source: ${EMOFACE_MODELS_DIR:?Set the authorized model directory}
        target: /app/models
        read_only: true
        bind: {create_host_path: false}
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,uid=10001,gid=10001,mode=700
      - /app/.cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001,mode=700
      - /run/faceattend-private:rw,noexec,nosuid,size=16k,uid=10001,gid=10001,mode=700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g
    cpus: 4
    shm_size: 256m
    healthcheck:
      test: [CMD, python, docker/runtime.py, health]
      interval: 15s
      timeout: 8s
      start_period: 120s
      retries: 12
    stop_grace_period: 30s
    restart: "no"
networks:
  local_only: {internal: false, enable_ipv6: false}
volumes:
  db_data:
  private_data:
  network_state:
secrets:
  db_admin_password:
    file: ${EMOFACE_SECRETS_DIR:?Set protected secret directory}/db_admin_password
  db_owner_password:
    file: ${EMOFACE_SECRETS_DIR:?Set protected secret directory}/db_owner_password
  db_runtime_password:
    file: ${EMOFACE_SECRETS_DIR:?Set protected secret directory}/db_runtime_password
  gallery_key:
    file: ${EMOFACE_SECRETS_DIR:?Set protected secret directory}/gallery_key
  operator_auth:
    file: ${EMOFACE_SECRETS_DIR:?Set protected secret directory}/operator_auth
